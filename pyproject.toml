[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kini-engine"
version = "0.2.0"
description = "Spanish Quiniela prediction engine based on KinielaGPT with mature statistical modelling and walk-forward validation."
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "requests>=2.31",
  "scipy>=1.12",
  "scikit-learn>=1.5",
  "penaltyblog>=1.13",
  "xmltodict>=0.13",
]

[project.optional-dependencies]
ml = ["xgboost>=3.0"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
mcp = ["mcp>=1.10"]
tuning = ["optuna>=5.0"]
all = ["xgboost>=3.0", "fastapi>=0.115", "uvicorn>=0.30", "mcp>=1.10", "optuna>=5.0"]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
kini = "kini_engine.cli:main"

[tool.setuptools.packages.find]
include = ["kini_engine*"]
