name: historical-backtest

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[ml]"
      - run: python scripts/build_history.py
      - name: Diagnose first ML forecast
        run: python scripts/diagnose_ml.py data/historical_spain.csv --min-train 300
      - name: Run historical comparison
        run: |
          python -m kini_engine.cli compare data/historical_spain.csv --min-train 300 --refit-every 30 > backtest-results.json
          cat backtest-results.json
      - name: Enforce non-empty model backtests
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("backtest-results.json").read_text())
          required = ("dc", "ml", "ensemble", "ensemble_dc_ml")
          total = int(result.get("n_total", 0))
          if total <= 0:
              raise SystemExit("Backtest has no test fixtures")
          for name in required:
              n = int(result.get(name, {}).get("n", 0))
              if n != total:
                  errors = result.get("prediction_errors", {}).get(name, {})
                  raise SystemExit(
                      f"{name} produced {n}/{total} predictions; "
                      f"errors={errors}"
                  )
          print(f"BACKTEST_ACCEPTANCE_OK: {total} fixtures for {', '.join(required)}")
          PY
      - name: Upload backtest results
        uses: actions/upload-artifact@v4
        with:
          name: historical-backtest
          path: backtest-results.json
          retention-days: 30
