name: historical-backtest

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[all]"
      - name: Restore Football-Data raw CSV cache
        uses: actions/cache@v4
        with:
          path: .cache/football-data
          key: football-data-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            football-data-${{ runner.os }}-${{ github.ref_name }}-
            football-data-${{ runner.os }}-
      - run: python scripts/build_history.py
      - name: Run historical comparison
        run: |
          python -m kini_engine.cli compare data/historical_spain.csv --min-train 300 --refit-every 1000 > backtest-results.json
          cat backtest-results.json
      - name: Upload historical dataset, profile and backtest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kini-historical-data
          path: |
            data/historical_spain.csv
            data/historical_spain.profile.json
            backtest-results.json
          if-no-files-found: warn
          retention-days: 30
