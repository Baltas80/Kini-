name: historical-backtest

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[all]"
      - run: python scripts/build_history.py
      - name: Run historical comparison
        run: |
          python -m kini_engine.cli compare data/historical_spain.csv --min-train 300 --refit-every 20 > backtest-results.json
          cat backtest-results.json
      - name: Upload backtest results
        uses: actions/upload-artifact@v4
        with:
          name: historical-backtest
          path: backtest-results.json
          retention-days: 30
