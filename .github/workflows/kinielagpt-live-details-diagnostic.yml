name: kinielagpt-live-details-diagnostic

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "kini_engine/sources.py"
      - "scripts/diagnose_kinielagpt_details.py"
      - "tests/test_sources.py"
      - "tests/test_kinielagpt_details_diagnostic.py"
      - ".github/workflows/kinielagpt-live-details-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      inspect: ${{ steps.filter.outputs.inspect }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - name: Check whether the latest commit changed diagnostic inputs
        id: filter
        shell: bash
        env:
          PR_ACTION: ${{ github.event.action || '' }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$PR_ACTION" == "opened" || "$PR_ACTION" == "reopened" ]]; then
            echo "inspect=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "inspect=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed_files="$(git diff --name-only HEAD^ HEAD)"
          if grep -Eq '^(kini_engine/sources.py|scripts/diagnose_kinielagpt_details.py|tests/test_sources.py|tests/test_kinielagpt_details_diagnostic.py|\\.github/workflows/kinielagpt-live-details-diagnostic\\.yml) <<<"$changed_files"; then
            echo "inspect=true" >> "$GITHUB_OUTPUT"
          else
            echo "inspect=false" >> "$GITHUB_OUTPUT"
          fi

  inspect:
    needs: changes
    if: needs.changes.outputs.inspect == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install adapter dependencies
        run: python -m pip install -e .
      - name: Inspect current jornada details (read-only GET)
        run: python scripts/diagnose_kinielagpt_details.py --output kinielagpt-details-diagnostic.json
      - name: Upload bounded schema evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kinielagpt-details-diagnostic
          path: kinielagpt-details-diagnostic.json
          retention-days: 7
          if-no-files-found: warn
