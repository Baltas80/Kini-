name: ci

on:
  push:
    paths:
      - "kini_engine/**"
      - "scripts/**"
      - "tests/**"
      - "data/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "kini_engine/**"
      - "scripts/**"
      - "tests/**"
      - "data/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
