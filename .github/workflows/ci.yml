name: ci

on:
  push:
    paths:
      - "kini_engine/**"
      - "scripts/**"
      - "tests/**"
      - "data/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - "AUDIT_PHASE1.md"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "kini_engine/**"
      - "scripts/**"
      - "tests/**"
      - "data/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - "AUDIT_PHASE1.md"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Lint fixture reconciliation and Liga F history
        run: >-
          ruff check
          kini_engine/fixture_reconciliation.py
          scripts/reconcile_selae_fixtures.py
          tests/test_fixture_reconciliation.py
          kini_engine/ligaf_evidence.py
          tests/test_ligaf_evidence.py
          kini_engine/ligaf_history.py
          scripts/import_ligaf_history.py
          tests/test_ligaf_history.py
          kini_engine/ligaf_team_profiles.py
          scripts/build_ligaf_team_profiles.py
          tests/test_ligaf_team_profiles.py
          kini_engine/core.py
          tests/test_core.py
          kini_engine/sources.py
          kini_engine/mcp_server.py
          scripts/diagnose_kinielagpt_details.py
          tests/test_sources.py
          tests/test_kinielagpt_details_diagnostic.py
      - name: Verify formatting for Liga F evidence code
        run: >-
          ruff format --check
          kini_engine/ligaf_evidence.py
          tests/test_ligaf_evidence.py
          kini_engine/ligaf_team_profiles.py
          scripts/build_ligaf_team_profiles.py
          tests/test_ligaf_team_profiles.py
          kini_engine/sources.py
          kini_engine/mcp_server.py
          scripts/diagnose_kinielagpt_details.py
          tests/test_sources.py
          tests/test_kinielagpt_details_diagnostic.py
      - run: pytest -q
