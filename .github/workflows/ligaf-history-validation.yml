name: ligaf-history-validation

on:
  push:
    branches:
      - "feat/selae-fixture-reconciliation"
    paths:
      - "kini_engine/ligaf_history.py"
      - "kini_engine/ligaf_team_profiles.py"
      - "scripts/build_ligaf_team_profiles.py"
      - ".github/workflows/ligaf-history-validation.yml"
  workflow_dispatch:
    inputs:
      max_current_matchday:
        description: Last current-season matchday to import (1-30)
        required: false
        type: number
        default: 10
      refresh:
        description: Refresh cached official pages
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ligaf-history-validation-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  import-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MAX_CURRENT_MATCHDAY: ${{ inputs.max_current_matchday || 10 }}
      REFRESH_HISTORY: ${{ inputs.refresh || false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Restore official Liga F HTML cache
        uses: actions/cache@v4
        with:
          path: .cache/ligaf
          key: ligaf-history-${{ runner.os }}-${{ github.head_ref || github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ligaf-history-${{ runner.os }}-${{ github.head_ref || github.ref_name }}-
            ligaf-history-${{ runner.os }}-
      - name: Import and validate official Liga F history
        shell: bash
        run: |
          args=(
            --seasons 2023 2024 2025 2026 2027
            --current-season 2027
            --max-current-matchday "$MAX_CURRENT_MATCHDAY"
            --cache-ttl-hours 168
            --request-delay 0.35
          )
          if [[ "$REFRESH_HISTORY" == "true" ]]; then
            args+=(--refresh)
          fi
          python scripts/import_ligaf_history.py "${args[@]}"
      - name: Build season-scoped historical team-profile evidence
        run: >-
          python scripts/build_ligaf_team_profiles.py
          --seasons 2023 2024 2025 2026
          --cache-ttl-hours 168
          --request-delay 0.35
      - name: Assert historical coverage and training exclusion
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          profile = json.loads(
              Path("data/ligaf_history.profile.json").read_text(encoding="utf-8")
          )
          if profile.get("integrity_passed") is not True:
              raise SystemExit("Liga F history integrity did not pass")
          if profile.get("training_eligibility", {}).get("eligible") is not False:
              raise SystemExit("Liga F history must remain excluded from training")

          for year in ("2023", "2024", "2025", "2026"):
              season = profile["season_profiles"][year]
              if season["scheduled_fixtures"] != 240 or season["played_fixtures"] != 240:
                  raise SystemExit(f"Completed season {year} is not a validated 240-match season")
              if season["team_count_in_played_fixtures"] != 16:
                  raise SystemExit(f"Completed season {year} does not contain 16 teams")
              if season["postponed_fixtures"] or season["suspended_fixtures"] or season["in_progress_fixtures"]:
                  raise SystemExit(f"Completed season {year} contains non-final fixtures")

          expected_current_matchday = int(os.environ["MAX_CURRENT_MATCHDAY"])
          current = profile["season_profiles"]["2027"]
          expected_current_fixtures = expected_current_matchday * 8
          if (
              current["requested_matchdays"] != expected_current_matchday
              or current["scheduled_fixtures"] != expected_current_fixtures
              or current["rounds_with_expected_fixture_count"] != expected_current_matchday
              or current["missing_or_incomplete_rounds"]
          ):
              raise SystemExit("Current-season round coverage does not match the requested range")
          if profile["unique_match_ids"] != profile["total_scheduled_fixtures"]:
              raise SystemExit("Liga F history contains duplicate or missing match IDs")

          historical_profiles = json.loads(
              Path("data/ligaf_historical_team_profiles.json").read_text(encoding="utf-8")
          )
          if historical_profiles.get("training_eligibility", {}).get("eligible") is not False:
              raise SystemExit("Historical profile evidence must remain excluded from training")
          for year in ("2023", "2024", "2025", "2026"):
              season = historical_profiles["seasons"][year]
              if season["team_count"] != 16 or season["unique_profile_ids"] != 16:
                  raise SystemExit(f"Historical profile coverage failed for {year}")
              if len(season["entries"]) != 16 or not season["all_profile_pages_verified"]:
                  raise SystemExit(f"Historical profile pages are incomplete for {year}")

          print(json.dumps(profile, indent=2, ensure_ascii=False))
          print(json.dumps(historical_profiles["cross_season_provider_id_observations"], indent=2, ensure_ascii=False))
          print(json.dumps(historical_profiles["cross_season_display_name_observations"], indent=2, ensure_ascii=False))
          print(json.dumps(historical_profiles["identity_audit_summary"], indent=2, ensure_ascii=False))
          PY
      - name: Upload Liga F history and provenance profiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ligaf-history
          path: |
            data/ligaf_history.jsonl
            data/ligaf_history.profile.json
            data/ligaf_historical_team_profiles.json
          if-no-files-found: warn
          retention-days: 30
