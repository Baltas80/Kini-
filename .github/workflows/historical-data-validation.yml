name: historical-data-validation

on:
  push:
    paths:
      - "scripts/build_history.py"
      - "kini_engine/dataio.py"
      - "kini_engine/team_identity.py"
      - "kini_engine/data/**"
      - "scripts/validate_team_identity_registry.py"
      - "data/**"
      - "!data/selae_fixture_crosswalk.json"
      - "!data/ligaf_fixture_evidence.json"
      - "!data/ligaf_history.jsonl"
      - "!data/ligaf_history.profile.json"
      - "!data/ligaf_team_profile_crosswalk.json"
      - "!kini_engine/data/ligaf_team_identity_registry.json"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/historical-data-validation.yml"
  pull_request:
    paths:
      - "scripts/build_history.py"
      - "kini_engine/dataio.py"
      - "kini_engine/team_identity.py"
      - "kini_engine/data/**"
      - "scripts/validate_team_identity_registry.py"
      - "data/**"
      - "!data/selae_fixture_crosswalk.json"
      - "!data/ligaf_fixture_evidence.json"
      - "!data/ligaf_history.jsonl"
      - "!data/ligaf_history.profile.json"
      - "!data/ligaf_team_profile_crosswalk.json"
      - "!kini_engine/data/ligaf_team_identity_registry.json"
      - "pyproject.toml"
      - "requirements*.txt"
      - ".github/workflows/historical-data-validation.yml"
  workflow_dispatch:
    inputs:
      refresh_source:
        description: "Refresh Football-Data only if still within the provider's weekly download allowance"
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "37 4 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Restore Football-Data raw CSV cache
        id: football_cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/football-data
          key: football-data-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            football-data-${{ runner.os }}-master-
      - name: Build historical data and profile
        env:
          REFRESH_SOURCE: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_source) }}
        run: |
          if [ "$REFRESH_SOURCE" = "true" ]; then
            python scripts/build_history.py --refresh --require-fresh
          else
            python scripts/build_history.py --offline
          fi
      - name: Enforce weekly Football-Data cache snapshot
        env:
          REFRESH_SOURCE: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_source) }}
        run: |
          python - <<'PY'
          import json
          import math
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          profile = json.loads(
              Path("data/historical_spain.profile.json").read_text(encoding="utf-8")
          )
          sources = profile.get("source_cache_metadata")
          if not profile.get("integrity_passed"):
              raise SystemExit("Historical dataset profile reports failed integrity")
          if len(profile.get("source_urls", [])) != 14:
              raise SystemExit("Expected exactly 14 Football-Data source URLs")
          if not isinstance(sources, list) or len(sources) != 14:
              raise SystemExit("Expected exactly 14 cached Football-Data source files")

          max_age_hours = 1.0 if os.environ.get("REFRESH_SOURCE") == "true" else 168.0
          stale = []
          mtimes = []
          for source in sources:
              age = source.get("cache_age_hours")
              modified = source.get("cache_file_mtime_utc")
              if (
                  not isinstance(age, (int, float))
                  or isinstance(age, bool)
                  or not math.isfinite(float(age))
                  or float(age) > max_age_hours
                  or not isinstance(modified, str)
              ):
                  stale.append(
                      (source.get("source_url"), source.get("cache_age_hours"))
                  )
                  continue
              timestamp = datetime.fromisoformat(modified)
              if timestamp.tzinfo is None or timestamp.utcoffset() is None:
                  stale.append((source.get("source_url"), "timezone-naive mtime"))
                  continue
              mtimes.append(timestamp.astimezone(timezone.utc))
          if stale:
              raise SystemExit(
                  f"Football-Data cache exceeds the {max_age_hours:g}-hour freshness limit: {stale}"
              )
          if len(mtimes) != 14 or (max(mtimes) - min(mtimes)).total_seconds() > 3600:
              raise SystemExit("Football-Data source files do not belong to one hourly snapshot")

          print(
              "WEEKLY_HISTORY_SOURCE_ACCEPTANCE_OK: "
              f"{len(sources)} source files; maximum age {max_age_hours:g} hours"
          )
          PY
      - name: Validate canonical team identities
        run: |
          python -m scripts.validate_team_identity_registry --csv data/historical_spain.csv --output data/team_identity_validation.json
      - name: Validate generated dataset and profile
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          profile = json.loads(Path("data/historical_spain.profile.json").read_text(encoding="utf-8"))
          if not profile.get("integrity_passed"):
              raise SystemExit("Dataset integrity checks did not pass")
          if int(profile.get("rows_after_deduplication", 0)) <= 0:
              raise SystemExit("Historical dataset is empty")
          if not profile.get("source_urls") or not profile.get("source_cache_metadata"):
              raise SystemExit("Dataset profile is missing source/cache provenance")
          seasons = profile.get("league_season_counts", {})
          for key in ("la-liga/2627", "segunda/2627"):
              if int(seasons.get(key, 0)) <= 0:
                  raise SystemExit(f"Current-season coverage missing: {key}")

          dataset = pd.read_csv("data/historical_spain.csv")
          required = {"Date", "HomeTeam", "AwayTeam", "FTHG", "FTAG", "League", "Season"}
          missing = required - set(dataset.columns)
          if missing:
              raise SystemExit(f"Historical CSV missing columns: {sorted(missing)}")
          if len(dataset) != int(profile["rows_after_deduplication"]):
              raise SystemExit("CSV row count does not match dataset profile")
          for column in ("Date", "HomeTeam", "AwayTeam", "FTHG", "FTAG"):
              if dataset[column].isna().any():
                  raise SystemExit(f"Historical CSV contains missing {column}")
          scores = dataset[["FTHG", "FTAG"]].apply(pd.to_numeric, errors="coerce")
          if scores.isna().any().any() or (scores < 0).any().any():
              raise SystemExit("Historical CSV contains invalid goal values")
          if ((scores % 1) != 0).any().any():
              raise SystemExit("Historical CSV contains fractional goals")
          dates = pd.to_datetime(dataset["Date"], dayfirst=True, errors="coerce")
          if dates.isna().any():
              raise SystemExit("Historical CSV contains unparseable dates")
          keys = pd.DataFrame({
              "League": dataset["League"].astype("string").str.strip().str.casefold(),
              "Season": dataset["Season"].astype("string").str.strip(),
              "Date": dates.dt.strftime("%Y-%m-%d"),
              "Home": dataset["HomeTeam"].astype("string").str.strip().str.casefold(),
              "Away": dataset["AwayTeam"].astype("string").str.strip().str.casefold(),
          })
          if keys.duplicated().any():
              raise SystemExit("Historical CSV still contains duplicate fixtures")
          print(json.dumps(profile, indent=2, ensure_ascii=False))
          print(f"DATA_VALIDATION_OK: {len(dataset)} completed fixtures")
          PY
      - name: Save refreshed Football-Data raw CSV cache
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_source)
        uses: actions/cache/save@v4
        with:
          path: .cache/football-data
          key: ${{ steps.football_cache.outputs.cache-primary-key }}
      - name: Upload historical dataset and quality profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kini-historical-data
          path: |
            data/historical_spain.csv
            data/historical_spain.profile.json
            data/team_identity_validation.json
          if-no-files-found: warn
          retention-days: 30
