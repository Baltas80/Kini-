name: selae-coupon-source-validation

on:
  push:
    branches:
      - feat/selae-official-coupon-ingestion
    paths:
      - "scripts/import_selae_results.py"
      - "tests/test_import_selae_results.py"
      - ".github/workflows/selae-coupon-validation.yml"

permissions:
  contents: read

concurrency:
  group: selae-coupon-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run deterministic parser and integrity tests
        run: pytest -q tests/test_import_selae_results.py
      - name: Probe official and independent historical sources from the runner network
        run: |
          python - <<'PY'
          import requests

          base = "https://www.loteriasyapuestas.es"
          headers = {
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Accept-Language": "es-ES,es;q=0.9,en;q=0.7",
              "Referer": base + "/es/la-quiniela/resultados",
          }
          urls = [
              base + "/es/la-quiniela/escrutinios/la-quiniela-premios-y-ganadores-del-08-de-noviembre-de-2026",
              base + "/f/loterias/resultados/quiniela.html?game_id=LAQU&fecha_sorteo=20261108",
              base + "/es/la-quiniela/escrutinios/la-quiniela-premios-y-ganadores-del-08-de-noviembre-de-2026.formatoRSS",
              base + "/es/la-quiniela/resultados",
              base + "/f/loterias/documentos/Quiniela/Notas%20de%20prensa/NOTA_DE_PRENSA_LA_QUINIELA_08_11_26.pdf",
              "https://www.historicoquiniela.com/historico/2026-2027/20",
              "https://www.historicoquiniela.com/robots.txt",
              "https://www.historicoquiniela.com/aviso-legal",
          ]
          for url in urls:
              try:
                  response = requests.get(url, headers=headers, timeout=(5, 20), allow_redirects=True)
                  sample = response.content[:100].decode(response.encoding or "utf-8", errors="replace").replace("\\n", " ")
                  print({
                      "requested": url,
                      "status": response.status_code,
                      "content_type": response.headers.get("Content-Type"),
                      "bytes": len(response.content),
                      "final_url": response.url,
                      "sample": sample,
                  })
              except requests.RequestException as exc:
                  print({"requested": url, "error": str(exc)})
          PY
      - name: Inspect the accessible secondary history page and robots policy
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          import requests

          base = "https://www.historicoquiniela.com"
          headers = {
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36",
              "Accept-Language": "es-ES,es;q=0.9",
          }
          robots = requests.get(base + "/robots.txt", headers=headers, timeout=(5, 20))
          print("ROBOTS_STATUS", robots.status_code)
          print("ROBOTS_BODY_START")
          print(robots.text)
          print("ROBOTS_BODY_END")

          class Structure(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.rows = []
                  self.row = None
                  self.cell = None
                  self.items = []
                  self.item = None
                  self.headings = []
                  self.heading = None
                  self.jsonld = []
                  self.script = False
                  self.script_type = ""

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "tr":
                      self.row = []
                  elif tag in {"td", "th"}:
                      self.cell = []
                  elif tag == "li":
                      self.item = []
                  elif tag in {"h1", "h2", "h3"}:
                      self.heading = []
                  elif tag == "script":
                      self.script = True
                      self.script_type = attrs.get("type", "")

              def handle_data(self, data):
                  value = " ".join(data.split())
                  if not value:
                      return
                  if self.cell is not None:
                      self.cell.append(value)
                  if self.item is not None:
                      self.item.append(value)
                  if self.heading is not None:
                      self.heading.append(value)
                  if self.script and self.script_type == "application/ld+json":
                      self.jsonld.append(value)

              def handle_endtag(self, tag):
                  if tag in {"td", "th"} and self.cell is not None:
                      if self.row is not None:
                          self.row.append(" ".join(self.cell))
                      self.cell = None
                  elif tag == "tr" and self.row is not None:
                      self.rows.append(self.row)
                      self.row = None
                  elif tag == "li" and self.item is not None:
                      self.items.append(" ".join(self.item))
                      self.item = None
                  elif tag in {"h1", "h2", "h3"} and self.heading is not None:
                      self.headings.append(" ".join(self.heading))
                      self.heading = None
                  elif tag == "script":
                      self.script = False
                      self.script_type = ""

          url = base + "/historico/2026-2027/20"
          response = requests.get(url, headers=headers, timeout=(5, 20))
          response.raise_for_status()
          parser = Structure()
          parser.feed(response.text)
          print("SECONDARY_STATUS", response.status_code, "BYTES", len(response.content))
          print("HEADINGS", parser.headings)
          print("TABLE_ROWS", parser.rows[:30])
          print("LIST_ITEMS", parser.items[:80])
          print("JSONLD", parser.jsonld[:5])
          PY
      - name: Fetch one known completed draw from the official source
        run: |
          python scripts/import_selae_results.py \
            --dates 2026-11-08 \
            --output /tmp/selae-quiniela.jsonl \
            --cache-dir /tmp/selae-cache
      - name: Validate the live official-source artifact
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          dataset = Path("/tmp/selae-quiniela.jsonl")
          profile = Path("/tmp/selae-quiniela.profile.json")
          lines = dataset.read_text(encoding="utf-8").splitlines()
          if len(lines) != 1:
              raise SystemExit(f"Expected one draw record, got {len(lines)}")
          draw = json.loads(lines[0])
          audit = json.loads(profile.read_text(encoding="utf-8"))
          if draw["draw_date"] != "2026-11-08":
              raise SystemExit("Unexpected draw date")
          if draw["fixture_count"] != 14 or len(draw["fixtures"]) != 14:
              raise SystemExit("Official coupon does not contain exactly 14 fixtures")
          if any(item["sign"] not in {"1", "X", "2"} for item in draw["fixtures"]):
              raise SystemExit("Invalid 1/X/2 sign in official coupon")
          if urlparse(draw["source_url"]).hostname != "www.loteriasyapuestas.es":
              raise SystemExit("Source URL is not the official SELAE host")
          if len(draw["raw_sha256"]) != 64:
              raise SystemExit("Missing raw response SHA-256")
          if audit.get("integrity_passed") is not True:
              raise SystemExit("SELAE data integrity profile failed")
          if audit.get("match_kickoff_dates_available") is not False:
              raise SystemExit("Kickoff-date limitation must remain explicit")
          print(f"SELAE_LIVE_SOURCE_ACCEPTANCE_OK: {len(draw['fixtures'])} fixtures")
          print(f"RAW_SHA256: {draw['raw_sha256']}")
          PY
      - name: Upload imported draw and provenance profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selae-quiniela-2026-11-08
          path: |
            /tmp/selae-quiniela.jsonl
            /tmp/selae-quiniela.profile.json
          if-no-files-found: warn
          retention-days: 30
