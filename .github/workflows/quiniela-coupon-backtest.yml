name: quiniela-coupon-backtest

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "kini_engine/coupons.py"
      - "kini_engine/coupon_identity.py"
      - "kini_engine/coupon_snapshot.py"
      - "kini_engine/data/historicoquiniela_team_aliases.json"
      - "kini_engine/data/selae_official_coupon_results/*.json"
      - "scripts/import_historical_coupons.py"
      - "scripts/backtest_coupons.py"
      - "tests/test_coupon_backtest.py"
      - "tests/test_coupon_identity.py"
      - "tests/test_coupon_snapshot.py"
      - "docs/COUPON_BACKTEST.md"
      - ".github/workflows/quiniela-coupon-backtest.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: quiniela-coupon-backtest-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_pilot: ${{ steps.filter.outputs.run_pilot }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - id: filter
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_BRANCH: ${{ github.head_ref || '' }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run_pilot=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # GitHub path filters see the whole PR diff. Compare with the last
          # successful coupon pilot so documentation-only commits do not rerun it.
          last_success=""
          runs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/quiniela-coupon-backtest.yml/runs?branch=$PR_BRANCH&event=pull_request&status=completed&per_page=100" 2>/dev/null || printf '{"workflow_runs":[]}')"
          while read -r run_id head_sha; do
            [[ -n "$run_id" && -n "$head_sha" ]] || continue
            jobs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" 2>/dev/null || printf '{"jobs":[]}')"
            if jq -e '[.jobs[]? | select(.name == "pilot" and .conclusion == "success")] | length > 0' <<<"$jobs_json" >/dev/null; then
              last_success="$head_sha"
              break
            fi
          done < <(
            jq -r '.workflow_runs[]? | select(.conclusion == "success") | [.id, .head_sha] | @tsv' <<<"$runs_json"
          )

          if [[ -n "$last_success" ]] && git fetch --no-tags origin "$last_success"; then
            if git merge-base --is-ancestor "$last_success" HEAD; then
              changed_files="$(git diff --name-only "$last_success" HEAD)"
            else
              git fetch --no-tags --depth=1 origin "$PR_BASE_SHA"
              changed_files="$(git diff --name-only "$PR_BASE_SHA" HEAD)"
            fi
          else
            git fetch --no-tags --depth=1 origin "$PR_BASE_SHA"
            changed_files="$(git diff --name-only "$PR_BASE_SHA" HEAD)"
          fi

          run_pilot=false
          while IFS= read -r path; do
            case "$path" in
              kini_engine/coupons.py|kini_engine/coupon_identity.py|kini_engine/coupon_snapshot.py|kini_engine/data/historicoquiniela_team_aliases.json|kini_engine/data/selae_official_coupon_results/*.json|scripts/import_historical_coupons.py|scripts/backtest_coupons.py|tests/test_coupon_backtest.py|tests/test_coupon_identity.py|tests/test_coupon_snapshot.py|pyproject.toml|requirements*.txt)
                run_pilot=true
                ;;
            esac
          done <<< "$changed_files"

          echo "Changed files since last successful coupon pilot:"
          printf '%s\n' "$changed_files"
          echo "run_pilot=$run_pilot" >> "$GITHUB_OUTPUT"
          echo "Coupon pilot required: $run_pilot"

  pilot:
    needs: changes
    if: needs.changes.outputs.run_pilot == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install model and test dependencies
        run: python -m pip install -e ".[ml,dev]"
      - name: Find latest validated dataset on PR base branch
        if: github.event_name == 'pull_request'
        id: source_dataset
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          runs_json="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/historical-data-validation.yml/runs" -f "branch=$BASE_BRANCH" -f status=completed -F per_page=100)"
          dataset_run_id=""
          while read -r run_id; do
            [[ -n "$run_id" ]] || continue
            artifacts_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100")"
            if jq -e '[.artifacts[]? | select(.name == "kini-historical-data" and .expired == false)] | length > 0' <<<"$artifacts_json" >/dev/null; then
              dataset_run_id="$run_id"
              break
            fi
          done < <(
            jq -r '.workflow_runs[]? | select(.conclusion == "success") | .id' <<<"$runs_json"
          )
          if [[ -z "$dataset_run_id" ]]; then
            echo "No successful, unexpired kini-historical-data artifact exists on base branch $BASE_BRANCH" >&2
            exit 1
          fi
          echo "Using validated historical dataset from run $dataset_run_id on $BASE_BRANCH"
          echo "run_id=$dataset_run_id" >> "$GITHUB_OUTPUT"
      - name: Download validated dataset from PR base branch
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@v4
        with:
          name: kini-historical-data
          run-id: ${{ steps.source_dataset.outputs.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: data
      - name: Build fresh history for manual runs
        if: github.event_name != 'pull_request'
        run: python scripts/build_history.py --refresh --require-fresh
      - name: Enforce validated historical dataset snapshot
        run: |
          python - <<'PY'
          import json
          import math
          from datetime import datetime, timezone
          from pathlib import Path

          import pandas as pd

          profile = json.loads(
              Path("data/historical_spain.profile.json").read_text(encoding="utf-8")
          )
          sources = profile.get("source_cache_metadata")
          if not profile.get("integrity_passed"):
              raise SystemExit("Historical dataset profile reports failed integrity")
          if len(profile.get("source_urls", [])) != 14:
              raise SystemExit("Expected exactly 14 Football-Data source URLs")
          if not isinstance(sources, list) or len(sources) != 14:
              raise SystemExit("Expected exactly 14 cached Football-Data source files")

          now = datetime.now(timezone.utc)
          stale = []
          mtimes = []
          for source in sources:
              modified = source.get("cache_file_mtime_utc")
              if not isinstance(modified, str):
                  stale.append((source.get("source_url"), "missing cache mtime"))
                  continue
              timestamp = datetime.fromisoformat(modified)
              if timestamp.tzinfo is None or timestamp.utcoffset() is None:
                  stale.append((source.get("source_url"), "timezone-naive mtime"))
                  continue
              timestamp = timestamp.astimezone(timezone.utc)
              age_hours = (now - timestamp).total_seconds() / 3600.0
              if not math.isfinite(age_hours) or age_hours < 0 or age_hours > 168.0:
                  stale.append((source.get("source_url"), age_hours))
                  continue
              mtimes.append(timestamp)
          if stale:
              raise SystemExit(f"Validated source snapshot is missing or older than seven days: {stale}")
          if len(mtimes) != 14 or (max(mtimes) - min(mtimes)).total_seconds() > 3600:
              raise SystemExit("Football-Data source files do not belong to one hourly snapshot")

          rows = int(profile.get("rows_after_deduplication", 0))
          dataset = pd.read_csv("data/historical_spain.csv")
          if rows <= 0 or len(dataset) != rows:
              raise SystemExit("Historical CSV row count does not match its validated profile")
          print(
              "VALIDATED_HISTORY_SNAPSHOT_OK: "
              f"{rows} completed fixtures from one immutable 14-file source snapshot"
          )
          PY
      - name: Import reviewed coupons from 2020-2021 and 2021-2022
        run: |
          python scripts/import_historical_coupons.py \
            --season 2020-2021 \
            --journeys 19 21 22 25 29 \
            --output coupon-archive-2020-2021.jsonl \
            --raw-dir coupon-raw \
            --official-snapshot-dir kini_engine/data/selae_official_coupon_results
          python scripts/import_historical_coupons.py \
            --season 2021-2022 \
            --journeys 1 \
            --output coupon-archive-2021-2022.jsonl \
            --raw-dir coupon-raw \
            --official-snapshot-dir kini_engine/data/selae_official_coupon_results
          python - <<'PY'
          import json
          from pathlib import Path

          source_paths = (
              Path("coupon-archive-2020-2021.jsonl"),
              Path("coupon-archive-2021-2022.jsonl"),
          )
          source_manifests = []
          coupons = []
          for source_path in source_paths:
              records = [
                  json.loads(line)
                  for line in source_path.read_text(encoding="utf-8").splitlines()
                  if line.strip()
              ]
              if not records or records[0].get("record_type") != "manifest":
                  raise SystemExit(f"{source_path}: missing archive manifest")
              manifest = records[0]
              if manifest.get("schema_version") != 1 or manifest.get("coupon_count") != len(records) - 1:
                  raise SystemExit(f"{source_path}: source manifest count/schema mismatch")
              source_manifests.append(manifest)
              for record in records[1:]:
                  if record.get("record_type") != "coupon":
                      raise SystemExit(f"{source_path}: non-coupon record after manifest")
                  coupons.append({key: value for key, value in record.items() if key != "record_type"})

          expected_ids = [
              "2020-2021:19", "2020-2021:21", "2020-2021:22",
              "2020-2021:25", "2020-2021:29", "2021-2022:1",
          ]
          actual_ids = [coupon.get("coupon_id") for coupon in coupons]
          if actual_ids != expected_ids:
              raise SystemExit(f"combined coupon archive IDs/order mismatch: {actual_ids}")

          journey_numbers = [
              {"season": "2020-2021", "number": number}
              for number in (19, 21, 22, 25, 29)
          ] + [{"season": "2021-2022", "number": 1}]
          manifest = {
              "record_type": "manifest",
              "schema_version": 1,
              "source": "historicoquiniela.com",
              "seasons": ["2020-2021", "2021-2022"],
              "journey_numbers": journey_numbers,
              "journey_ids": expected_ids,
              "coupon_count": len(coupons),
              "timezone": "Europe/Madrid",
              "official_verification": (
                  "14 main fixtures and Pleno al 15 independently reconciled "
                  "against reviewed official SELAE snapshots"
              ),
              "source_manifests": source_manifests,
          }
          output = [manifest] + [
              {"record_type": "coupon", **coupon} for coupon in coupons
          ]
          Path("coupon-archive.jsonl").write_text(
              "\n".join(
                  json.dumps(record, ensure_ascii=False, sort_keys=True)
                  for record in output
              ) + "\n",
              encoding="utf-8",
          )
          print(f"COMBINED_COUPON_ARCHIVE_OK: {len(coupons)} coupons across two seasons")
          PY
      - name: Run common-cutoff coupon backtest
        env:
          KINI_CODE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/backtest_coupons.py \
            data/historical_spain.csv \
            coupon-archive.jsonl \
            --budget 8 \
            --min-history 250 \
            --output coupon-backtest.json
      - name: Enforce multi-coupon acceptance
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          result = json.loads(Path("coupon-backtest.json").read_text(encoding="utf-8"))
          archive = [
              json.loads(line)
              for line in Path("coupon-archive.jsonl").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          expected = {
              "2020-2021:19": ("2020-2021", 19, "2020-12-06"),
              "2020-2021:21": ("2020-2021", 21, "2020-12-13"),
              "2020-2021:22": ("2020-2021", 22, "2020-12-20"),
              "2020-2021:25": ("2020-2021", 25, "2021-01-03"),
              "2020-2021:29": ("2020-2021", 29, "2021-01-24"),
              "2021-2022:1": ("2021-2022", 1, "2021-08-15"),
          }
          expected_ids = list(expected)
          if len(archive) != len(expected) + 1:
              raise SystemExit(
                  f"expected manifest plus {len(expected)} coupons, received {len(archive)} records"
              )
          manifest = archive[0]
          expected_journey_numbers = [
              {"season": season, "number": journey}
              for season, journey, _ in expected.values()
          ]
          if (
              manifest.get("record_type") != "manifest"
              or manifest.get("coupon_count") != len(expected)
              or manifest.get("seasons") != ["2020-2021", "2021-2022"]
              or manifest.get("journey_numbers") != expected_journey_numbers
              or manifest.get("journey_ids") != expected_ids
          ):
              raise SystemExit("coupon archive manifest does not describe the six verified journeys")
          archive_coupons = {
              item.get("coupon_id"): item
              for item in archive[1:]
              if item.get("record_type") == "coupon"
          }
          if list(archive_coupons) != expected_ids:
              raise SystemExit(f"coupon archive IDs/order differ: {list(archive_coupons)}")

          for coupon_id, (season, journey, draw_date) in expected.items():
              snapshot_path = Path(
                  f"kini_engine/data/selae_official_coupon_results/{season}-{journey}.json"
              )
              snapshot = json.loads(snapshot_path.read_text(encoding="utf-8"))
              snapshot_sha = hashlib.sha256(snapshot_path.read_bytes()).hexdigest()
              archived = archive_coupons[coupon_id]
              if (
                  archived.get("coupon_id") != coupon_id
                  or archived.get("season") != season
                  or archived.get("jornada") != journey
                  or archived.get("source_date") != draw_date
              ):
                  raise SystemExit(f"{coupon_id}: archive identity/date mismatch")
              if archived.get("official_result_sha256") != snapshot_sha:
                  raise SystemExit(f"{coupon_id}: archive does not hash the exact normalized SELAE snapshot bytes")
              if archived.get("official_result_snapshot_type") != "normalized_json_extract_not_raw_html":
                  raise SystemExit(f"{coupon_id}: normalized snapshot type is not declared")
              if archived.get("official_result_url") != snapshot.get("source_url"):
                  raise SystemExit(f"{coupon_id}: official source URL mismatch")
              if "result_published_at" in archived or not archived.get("source_date_label_at"):
                  raise SystemExit(f"{coupon_id}: source date label is missing or misrepresented as a publication timestamp")
              if archived.get("official_main_matches_verified") is not True:
                  raise SystemExit(f"{coupon_id}: 14 main results were not verified against SELAE")
              if archived.get("official_pleno_verified") is not True:
                  raise SystemExit(f"{coupon_id}: Pleno al 15 was not verified against SELAE")

          coupons = result.get("coupons", [])
          expected_ids = list(expected)
          if [coupon.get("coupon_id") for coupon in coupons] != expected_ids:
              raise SystemExit(f"backtest coupon IDs/order differ: {[c.get('coupon_id') for c in coupons]}")
          if result.get("schema_version") != 3 or result.get("config", {}).get("min_history_matches") != 250:
              raise SystemExit("backtest result schema or minimum-history configuration mismatch")
          if result.get("summary", {}).get("coupon_count") != 6:
              raise SystemExit("backtest summary does not contain six coupons")

          for coupon in coupons:
              coupon_id = coupon["coupon_id"]
              if coupon.get("status") == "failed":
                  raise SystemExit(f"{coupon_id}: coupon evaluation failed: {coupon.get('error')}")
              if coupon.get("official_main_matches_verified") is not True:
                  raise SystemExit(f"{coupon_id}: main fixtures were not reconciled with SELAE")
              if coupon.get("official_pleno_verified") is not True:
                  raise SystemExit(f"{coupon_id}: Pleno al 15 was not reconciled with SELAE")
              if coupon.get("training_cutoff_date") >= coupon.get("first_kickoff_at", "")[:10]:
                  raise SystemExit(f"{coupon_id}: training cutoff is not strictly before first kickoff")
              if coupon.get("training_match_count", 0) < 250:
                  raise SystemExit(f"{coupon_id}: training history is below 250 matches")
              if coupon.get("training_history_max_date", "") > coupon.get("training_cutoff_date", ""):
                  raise SystemExit(f"{coupon_id}: training history crosses its declared cutoff")
              if coupon.get("fixture_reconciliation_count") != 15:
                  raise SystemExit(f"{coupon_id}: all 15 fixtures were not reconciled to Football-Data")
              reconciliation = coupon.get("fixture_reconciliation")
              if not isinstance(reconciliation, list) or [item.get("number") for item in reconciliation] != list(range(1, 16)):
                  raise SystemExit(f"{coupon_id}: ordered reconciliation evidence is incomplete")
              pleno = coupon.get("pleno_prediction", {})
              if pleno.get("model") != "dixon_coles":
                  raise SystemExit(f"{coupon_id}: Pleno prediction model provenance is missing")
              if pleno.get("selection_method") != "max_aggregated_category_pair_probability":
                  raise SystemExit(f"{coupon_id}: Pleno category-pair selection method is not explicit")
              if not 0.0 <= float(pleno.get("probability_mass", -1.0)) <= 1.0:
                  raise SystemExit(f"{coupon_id}: Pleno category-pair probability mass is invalid")
              for mode in ("dc", "ml", "ensemble_dc_ml"):
                  model = coupon.get("models", {}).get(mode, {})
                  if model.get("status") != "success" or model.get("n_predictions") != 14:
                      raise SystemExit(f"{coupon_id} {mode}: expected 14 valid forecasts, received {model}")
                  if model.get("total_bets", 31105) > 31104:
                      raise SystemExit(f"{coupon_id} {mode}: exceeds SELAE's authorized total-bet cap")
                  if model.get("column_count", 0) > 8:
                      raise SystemExit(f"{coupon_id} {mode}: exceeds the configured 8-column budget")
                  columns = model.get("columns")
                  if not isinstance(columns, list) or len(columns) != model.get("column_count"):
                      raise SystemExit(f"{coupon_id} {mode}: exact direct columns are missing")
                  if model.get("total_bets") != model.get("column_count") * model.get("pleno15_multiplier"):
                      raise SystemExit(f"{coupon_id} {mode}: total bets do not include the Pleno multiplier")
                  if model.get("total_bets", 0) < model.get("minimum_total_bets", 2):
                      raise SystemExit(f"{coupon_id} {mode}: below SELAE minimum participation")
                  if model.get("total_bets", 0) > model.get("maximum_authorized_total_bets", 0):
                      raise SystemExit(f"{coupon_id} {mode}: exceeds SELAE maximum participation")
                  if model.get("price_per_bet_eur") != 0.75:
                      raise SystemExit(f"{coupon_id} {mode}: price per bet differs from SELAE")
                  expected_cost = round(model.get("total_bets") * model.get("price_per_bet_eur"), 2)
                  if abs(model.get("cost_eur") - expected_cost) > 0.005:
                      raise SystemExit(f"{coupon_id} {mode}: cost does not match the expanded bet count")

          for mode in ("dc", "ml", "ensemble_dc_ml"):
              aggregate = result.get("summary", {}).get("models", {}).get(mode, {})
              if aggregate.get("evaluated_coupons") != 6 or aggregate.get("failed_coupons") != 0:
                  raise SystemExit(f"{mode}: aggregate did not evaluate all six coupons: {aggregate}")
          print("COUPON_ACCEPTANCE_OK: 6 official coupons across two seasons, 90 SELAE results, 90 canonical fixture reconciliations, 18 x 14 forecasts, optimizer within SELAE limits")
          PY
      - name: Upload coupon pilot evidence
        uses: actions/upload-artifact@v4
        with:
          name: quiniela-coupon-pilot
          path: |
            coupon-archive.jsonl
            coupon-backtest.json
            coupon-raw/**/*.html
            kini_engine/data/selae_official_coupon_results/*.json
          retention-days: 90
