name: quiniela-coupon-backtest

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "kini_engine/coupons.py"
      - "kini_engine/coupon_identity.py"
      - "kini_engine/coupon_snapshot.py"
      - "kini_engine/data/historicoquiniela_team_aliases.json"
      - "kini_engine/data/selae_official_coupon_results/2020-2021-21.json"
      - "scripts/import_historical_coupons.py"
      - "scripts/backtest_coupons.py"
      - "tests/test_coupon_backtest.py"
      - "tests/test_coupon_identity.py"
      - "tests/test_coupon_snapshot.py"
      - "docs/COUPON_BACKTEST.md"
      - ".github/workflows/quiniela-coupon-backtest.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: quiniela-coupon-backtest-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_pilot: ${{ steps.filter.outputs.run_pilot }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - id: filter
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_BRANCH: ${{ github.head_ref || '' }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run_pilot=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # GitHub path filters see the whole PR diff. Compare with the last
          # successful coupon pilot so documentation-only commits do not rerun it.
          last_success=""
          runs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/quiniela-coupon-backtest.yml/runs?branch=$PR_BRANCH&event=pull_request&status=completed&per_page=100" 2>/dev/null || printf '{"workflow_runs":[]}')"
          while read -r run_id head_sha; do
            [[ -n "$run_id" && -n "$head_sha" ]] || continue
            jobs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" 2>/dev/null || printf '{"jobs":[]}')"
            if jq -e '[.jobs[]? | select(.name == "pilot" and .conclusion == "success")] | length > 0' <<<"$jobs_json" >/dev/null; then
              last_success="$head_sha"
              break
            fi
          done < <(
            jq -r '.workflow_runs[]? | select(.conclusion == "success") | [.id, .head_sha] | @tsv' <<<"$runs_json"
          )

          if [[ -n "$last_success" ]] && git fetch --no-tags origin "$last_success"; then
            if git merge-base --is-ancestor "$last_success" HEAD; then
              changed_files="$(git diff --name-only "$last_success" HEAD)"
            else
              git fetch --no-tags --depth=1 origin "$PR_BASE_SHA"
              changed_files="$(git diff --name-only "$PR_BASE_SHA" HEAD)"
            fi
          else
            git fetch --no-tags --depth=1 origin "$PR_BASE_SHA"
            changed_files="$(git diff --name-only "$PR_BASE_SHA" HEAD)"
          fi

          run_pilot=false
          while IFS= read -r path; do
            case "$path" in
              kini_engine/coupons.py|kini_engine/coupon_identity.py|kini_engine/coupon_snapshot.py|kini_engine/data/historicoquiniela_team_aliases.json|kini_engine/data/selae_official_coupon_results/2020-2021-21.json|scripts/import_historical_coupons.py|scripts/backtest_coupons.py|tests/test_coupon_backtest.py|tests/test_coupon_identity.py|tests/test_coupon_snapshot.py|docs/COUPON_BACKTEST.md|.github/workflows/quiniela-coupon-backtest.yml|pyproject.toml|requirements*.txt)
                run_pilot=true
                ;;
            esac
          done <<< "$changed_files"

          echo "Changed files since last successful coupon pilot:"
          printf '%s\n' "$changed_files"
          echo "run_pilot=$run_pilot" >> "$GITHUB_OUTPUT"
          echo "Coupon pilot required: $run_pilot"

  pilot:
    needs: changes
    if: needs.changes.outputs.run_pilot == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install model and test dependencies
        run: python -m pip install -e ".[ml,dev]"
      - name: Build historical training dataset
        run: python scripts/build_history.py
      - name: Import Jornada 21 from reviewed snapshot directory
        run: |
          python scripts/import_historical_coupons.py \
            --season 2020-2021 \
            --journeys 21 \
            --output coupon-archive.jsonl \
            --raw-dir coupon-raw \
            --official-snapshot-dir kini_engine/data/selae_official_coupon_results
      - name: Run common-cutoff coupon backtest
        env:
          KINI_CODE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python scripts/backtest_coupons.py \
            data/historical_spain.csv \
            coupon-archive.jsonl \
            --budget 8 \
            --min-history 300 \
            --output coupon-backtest.json
      - name: Enforce coupon-level acceptance
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          result = json.loads(Path("coupon-backtest.json").read_text(encoding="utf-8"))
          archive = [
              json.loads(line)
              for line in Path("coupon-archive.jsonl").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          snapshot_path = Path("kini_engine/data/selae_official_coupon_results/2020-2021-21.json")
          snapshot_sha = hashlib.sha256(snapshot_path.read_bytes()).hexdigest()
          if len(archive) != 2 or archive[1].get("official_result_sha256") != snapshot_sha:
              raise SystemExit("coupon archive does not reference the exact official snapshot bytes")
          if archive[1].get("official_result_snapshot_type") != "normalized_json_extract_not_raw_html":
              raise SystemExit("official result snapshot type is not declared")
          coupons = result.get("coupons", [])
          if len(coupons) != 1:
              raise SystemExit(f"expected one pilot coupon, received {len(coupons)}")
          coupon = coupons[0]
          if coupon.get("status") == "failed":
              raise SystemExit(f"coupon evaluation failed: {coupon.get('error')}")
          if "result_published_at" in archive[1] or not archive[1].get("source_date_label_at"):
              raise SystemExit("coupon source date label is missing or misrepresented as a publication timestamp")
          if coupon.get("official_main_matches_verified") is not True:
              raise SystemExit("main fixtures were not reconciled with SELAE")
          if coupon.get("official_pleno_verified") is not True:
              raise SystemExit("Pleno al 15 was not reconciled with SELAE")
          if coupon.get("training_cutoff_date") >= coupon.get("first_kickoff_at", "")[:10]:
              raise SystemExit("training cutoff is not strictly before the first kickoff date")
          if coupon.get("training_match_count", 0) < 300:
              raise SystemExit("coupon training history is below the required minimum")
          if coupon.get("fixture_reconciliation_count") != 15:
              raise SystemExit("all 15 coupon fixtures were not reconciled to Football-Data")
          pleno = coupon.get("pleno_prediction", {})
          if pleno.get("model") != "dixon_coles":
              raise SystemExit("Pleno prediction model provenance is missing or incorrect")
          if pleno.get("selection_method") != "max_aggregated_category_pair_probability":
              raise SystemExit("Pleno category-pair selection method is not explicit")
          if not 0.0 <= float(pleno.get("probability_mass", -1.0)) <= 1.0:
              raise SystemExit("Pleno category-pair probability mass is invalid")
          for mode in ("dc", "ml", "ensemble_dc_ml"):
              model = coupon.get("models", {}).get(mode, {})
              if model.get("status") != "success" or model.get("n_predictions") != 14:
                  raise SystemExit(f"{mode} did not produce 14 valid forecasts: {model}")
              if model.get("total_bets", 31105) > 31104:
                  raise SystemExit(f"{mode} exceeds SELAE's authorized total-bet cap")
              if model.get("column_count", 0) > 8:
                  raise SystemExit(f"{mode} exceeds the configured 8-column budget")
              columns = model.get("columns")
              if not isinstance(columns, list) or len(columns) != model.get("column_count"):
                  raise SystemExit(f"{mode} does not persist its exact direct columns")
              if model.get("total_bets") != model.get("column_count") * model.get("pleno15_multiplier"):
                  raise SystemExit(f"{mode} total bets do not include the Pleno multiplier")
              expected_cost = round(model.get("total_bets") * model.get("price_per_bet_eur"), 2)
              if abs(model.get("cost_eur") - expected_cost) > 0.005:
                  raise SystemExit(f"{mode} cost does not match total bets and price")
          print("COUPON_ACCEPTANCE_OK: 15 official results, 15 canonical fixtures, one pre-kickoff snapshot, 3 x 14 forecasts, optimizer within cap")
          PY
      - name: Upload coupon pilot evidence
        uses: actions/upload-artifact@v4
        with:
          name: quiniela-coupon-pilot
          path: |
            coupon-archive.jsonl
            coupon-backtest.json
            coupon-raw/**/*.html
            kini_engine/data/selae_official_coupon_results/2020-2021-21.json
          retention-days: 90
