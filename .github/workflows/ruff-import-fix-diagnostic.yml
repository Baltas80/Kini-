name: Ruff import-fix diagnostic

on:
  push:
    branches:
      - feat/immutable-ticket-ledger

permissions:
  contents: read

jobs:
  fix-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Apply Ruff import fix and show result
        run: |
          ruff check --fix scripts/summarize_odds_api_coverage.py
          cat scripts/summarize_odds_api_coverage.py
      - uses: actions/upload-artifact@v4
        with:
          name: ruff-fixed-summary
          path: scripts/summarize_odds_api_coverage.py
          retention-days: 1
