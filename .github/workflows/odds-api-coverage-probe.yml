name: The Odds API coverage probe

on:
  workflow_dispatch:
    inputs:
      region:
        description: Bookmaker region for coverage discovery
        required: true
        type: choice
        options:
          - eu
          - uk
          - us
          - au
        default: eu
      lead_hours:
        description: Comma-separated pre-kickoff horizons (maximum three)
        required: true
        type: string
        default: "24,6,1"

permissions:
  contents: read

# Serialize manual runs to avoid overlapping provider-quota usage.
concurrency:
  group: odds-api-coverage-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install -e .

      - name: Require repository API-key secret
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          if [ -z "${THE_ODDS_API_KEY:-}" ]; then
            echo "::error::Configure the repository Actions secret THE_ODDS_API_KEY before running this workflow."
            exit 1
          fi

      - name: Enforce the bounded verified sample and request budget
        env:
          LEAD_HOURS: ${{ inputs.lead_hours }}
        run: |
          python - <<'PY'
          import os
          from scripts.probe_the_odds_api_coverage import (
              load_probe_fixtures,
              parse_lead_hours,
          )

          fixtures, _ = load_probe_fixtures("data/selae_fixture_crosswalk.json")
          leads = parse_lead_hours(os.environ["LEAD_HOURS"])
          if len(fixtures) > 10:
              raise SystemExit(
                  f"Refusing {len(fixtures)} fixtures; this pilot is capped at 10"
              )
          if len(leads) > 3:
              raise SystemExit(
                  f"Refusing {len(leads)} horizons; this pilot is capped at 3"
              )
          competitions = {fixture.competition_id for fixture in fixtures}
          if competitions != {"SP1", "SP2"}:
              raise SystemExit(
                  f"Expected a sample from SP1 and SP2, found {sorted(competitions)}"
              )
          request_cap = len(fixtures) * len(leads) * 2
          if request_cap > 60:
              raise SystemExit(f"Refusing request budget {request_cap}; maximum is 60")
          print(
              f"Bounded sample accepted: {len(fixtures)} fixtures, "
              f"{len(leads)} horizons, at most {request_cap} requests/credits"
          )
          PY

      - name: Probe historical event and market coverage only
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          REGION: ${{ inputs.region }}
          LEAD_HOURS: ${{ inputs.lead_hours }}
        run: |
          python scripts/probe_the_odds_api_coverage.py \
            --lead-hours "$LEAD_HOURS" \
            --region "$REGION"

      - name: Publish aggregate-only job summary and remove raw report
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from collections import defaultdict
          from pathlib import Path

          report_path = Path("artifacts/the_odds_api_coverage.json")
          if not report_path.exists():
              print("No coverage report was produced.")
              raise SystemExit(0)

          report = json.loads(report_path.read_text(encoding="utf-8"))
          groups = defaultdict(lambda: {
              "fixtures": 0,
              "exact": 0,
              "h2h": 0,
              "without_h2h": 0,
              "unmatched": 0,
              "ambiguous": 0,
          })
          for row in report.get("results", []):
              key = (row["competition_id"], row["requested_lead_hours"])
              item = groups[key]
              item["fixtures"] += 1
              item["exact"] += row["match_status"] == "exact"
              item["h2h"] += row["coverage_status"] == "h2h_available"
              item["without_h2h"] += (
                  row["coverage_status"] == "event_found_without_h2h"
              )
              item["unmatched"] += row["match_status"] == "no_exact_match"
              item["ambiguous"] += row["match_status"] == "ambiguous"
              item["kickoff_mismatch"] += (
                  row["match_status"] == "kickoff_mismatch"
              )
              item["post_kickoff"] += (
                  row["coverage_status"] == "snapshot_not_pre_kickoff"
              )

          lines = [
              "# The Odds API — aggregate coverage probe",
              "",
              f"- Generated (UTC): {report['generated_at_utc']}",
              f"- Fixture/horizon checks: {report['fixture_probe_count']}",
              f"- API requests: {report['api_request_count']}",
              f"- Maximum credit estimate: {report['estimated_credits_upper_bound']}",
              f"- Provider-reported credits: {report['reported_credits_last_sum']}",
              f"- Historical prices requested: {report['historical_odds_prices_requested']}",
              f"- Production dataset modified: {report['production_dataset_modified']}",
              f"- Eligible for model input: {report['eligible_for_model_input']}",
              "",
              "| Competition | Lead (h) | Fixtures | Exact event | h2h | Event without h2h | Unmatched | Kickoff mismatch | Ambiguous | Post-kickoff snapshot |",
              "|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|",
          ]
          for (competition, lead), item in sorted(groups.items()):
              lines.append(
                  f"| {competition} | {lead:g} | {item['fixtures']} | "
                  f"{item['exact']} | {item['h2h']} | {item['without_h2h']} | "
                  f"{item['unmatched']} | {item['kickoff_mismatch']} | "
                  f"{item['ambiguous']} | {item['post_kickoff']} |"
              )
          lines.extend([
              "",
              "Only aggregate counts are retained in this workflow summary. "
              "Raw provider responses, event IDs and bookmaker-level records are not uploaded.",
          ])
          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary_path.open("a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")

          report_path.unlink(missing_ok=True)
          try:
              report_path.parent.rmdir()
          except OSError:
              pass
          PY
