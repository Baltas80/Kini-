name: The Odds API coverage probe

on:
  workflow_dispatch:
    inputs:
      region:
        description: Bookmaker region for coverage discovery
        required: true
        type: choice
        options:
          - eu
          - uk
          - us
          - au
        default: eu
      lead_hours:
        description: Comma-separated pre-kickoff horizons (maximum three)
        required: true
        type: string
        default: "24,6,1"

permissions:
  contents: read

# Serialize manual runs to avoid overlapping provider-quota usage.
concurrency:
  group: odds-api-coverage-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install -e .

      - name: Require repository API-key secret
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          if [ -z "${THE_ODDS_API_KEY:-}" ]; then
            echo "::error::Configure the repository Actions secret THE_ODDS_API_KEY before running this workflow."
            exit 1
          fi

      - name: Enforce the bounded verified sample and request budget
        env:
          LEAD_HOURS: ${{ inputs.lead_hours }}
        run: |
          python - <<'PY'
          import os
          from scripts.probe_the_odds_api_coverage import (
              load_probe_fixture_bundle,
              parse_lead_hours,
          )

          fixtures, _ = load_probe_fixture_bundle(
              "data/selae_fixture_crosswalk.json",
              "data/odds_api_coverage_historical_sample.json",
          )
          leads = parse_lead_hours(os.environ["LEAD_HOURS"])
          if len(fixtures) > 16:
              raise SystemExit(
                  f"Refusing {len(fixtures)} fixtures; this pilot is capped at 16"
              )
          if len(leads) > 3:
              raise SystemExit(
                  f"Refusing {len(leads)} horizons; this pilot is capped at 3"
              )
          competitions = {fixture.competition_id for fixture in fixtures}
          if competitions != {"SP1", "SP2"}:
              raise SystemExit(
                  f"Expected a sample from SP1 and SP2, found {sorted(competitions)}"
              )
          request_cap = len(fixtures) * len(leads) * 2
          if request_cap > 96:
              raise SystemExit(f"Refusing request budget {request_cap}; maximum is 96")
          print(
              f"Bounded sample accepted: {len(fixtures)} fixtures, "
              f"{len(leads)} horizons, at most {request_cap} requests/credits"
          )
          PY

      - name: Probe historical event and market coverage only
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          REGION: ${{ inputs.region }}
          LEAD_HOURS: ${{ inputs.lead_hours }}
        run: |
          python scripts/probe_the_odds_api_coverage.py \
            --lead-hours "$LEAD_HOURS" \
            --region "$REGION"

      - name: Publish aggregate-only job summary and remove raw report
        if: always()
        run: python scripts/summarize_odds_api_coverage.py
