name: selae-result-archive-discovery

on:
  push:
    branches:
      - feat/selae-fixture-reconciliation
    paths:
      - "scripts/discover_selae_result_archive.py"
      - ".github/workflows/selae-result-archive-discovery.yml"
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "scripts/discover_selae_result_archive.py"
      - ".github/workflows/selae-result-archive-discovery.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selae-result-archive-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
      - name: Check whether the latest commit changed archive discovery
        id: scope
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            changed_files="$(git diff --name-only HEAD^ HEAD)"
          else
            changed_files="$(git show --pretty='' --name-only HEAD)"
          fi
          printf '%s\n' "$changed_files"
          if grep -Eq '^(scripts/discover_selae_result_archive.py|\.github/workflows/selae-result-archive-discovery\.yml)$' <<< "$changed_files"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: "3.12"
      - name: Install discovery dependencies
        if: steps.scope.outputs.run == 'true'
        run: python -m pip install -e ".[dev]"
      - name: Discover official archive pages and draw links
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            python -m scripts.discover_selae_result_archive \
              --output-dir artifacts/selae-result-archive
          else
            python -m scripts.discover_selae_result_archive \
              --max-archive-page 2 \
              --output-dir artifacts/selae-result-archive
          fi
      - name: Upload discovery report
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: selae-result-archive-discovery
          path: artifacts/selae-result-archive/
          if-no-files-found: warn
          retention-days: 30
