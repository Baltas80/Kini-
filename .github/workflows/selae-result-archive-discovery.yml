name: selae-result-archive-discovery

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selae-result-archive-discovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install discovery dependencies
        run: python -m pip install -e ".[dev]"
      - name: Discover official archive pages and draw links
        run: >-
          python -m scripts.discover_selae_result_archive
          --output-dir artifacts/selae-result-archive
      - name: Upload discovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selae-result-archive-discovery
          path: artifacts/selae-result-archive/
          if-no-files-found: warn
          retention-days: 30
